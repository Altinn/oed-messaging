# Workflow for building and publishing Altinn.Dd.Tests.DependencyGate NuGet package
name: Release DependencyGate Package
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
    # Pattern matches tags like dependencygate-v1.0.0, dependencygate-v1.0.0-preview, etc.
    # Requires at least one dot after the version prefix to avoid matching invalid tags
    - "dependencygate-v*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
      with:
        dotnet-version: '10.0.x'

    - name: Set VERSION variable from tag or default
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" =~ ^refs/tags/dependencygate-v ]]; then
          VERSION=${GITHUB_REF#refs/tags/dependencygate-v}
          echo "VERSION: ${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
        else
          # For path-based triggers or manual dispatch, use a default version
          VERSION="1.0.0-preview"
          echo "VERSION: ${VERSION} (preview)"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
        fi

    - name: Set PROJECT variable to DependencyGate project
      run: |
        PROJECT=$(find . -name 'Altinn.Dd.Tests.DependencyGate.csproj' -printf "%p" -quit)
        if [[ "${PROJECT}" == "" ]]; then echo "Altinn.Dd.Tests.DependencyGate.csproj not found! Exiting"; exit 1; fi
        echo "PROJECT: ${PROJECT}"
        echo "PROJECT=${PROJECT}" >> $GITHUB_ENV

    # Both test projects cover code that ships in this package: the gates' own logic, and the
    # shared sources in Altinn.Dd.Tests.Shared compiled into each gate. Run both rather than
    # trying to match a test project to the package being released.
    - name: Restore dependencies
      run: |
        dotnet restore ${PROJECT}
        dotnet restore qa/Altinn.Dd.Tests.DependencyGate.Tests/Altinn.Dd.Tests.DependencyGate.Tests.csproj
        dotnet restore qa/Altinn.Dd.Tests.Shared.Tests/Altinn.Dd.Tests.Shared.Tests.csproj

    - name: Build
      run: dotnet build --configuration Release --no-restore /p:Version=${VERSION} ${PROJECT}

    - name: Build test projects
      run: |
        dotnet build qa/Altinn.Dd.Tests.DependencyGate.Tests/Altinn.Dd.Tests.DependencyGate.Tests.csproj --configuration Release --no-restore /p:Version=${VERSION}
        dotnet build qa/Altinn.Dd.Tests.Shared.Tests/Altinn.Dd.Tests.Shared.Tests.csproj --configuration Release --no-restore /p:Version=${VERSION}

    - name: Run tests
      run: |
        dotnet test qa/Altinn.Dd.Tests.DependencyGate.Tests/Altinn.Dd.Tests.DependencyGate.Tests.csproj --configuration Release --no-build --verbosity normal
        dotnet test qa/Altinn.Dd.Tests.Shared.Tests/Altinn.Dd.Tests.Shared.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Pack with debug symbols
      run: dotnet pack --configuration Release --no-build /p:Version=${VERSION} -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg --output . ${PROJECT}

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: package
        path: '*.*nupkg'

  push-to-nuget:
    name: Push to nuget.org (only for tagged releases)
    # A manual dispatch, even against a tag, builds the 1.0.0-preview fallback and must not publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dependencygate-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # nuget.org trusted publishing exchanges the GitHub OIDC token for a short-lived API key
    steps:
    - name: Download artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: package
    - name: Log in to nuget.org
      id: nuget_login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ vars.NUGET_USER }}
    - name: Push to nuget.org
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        dotnet nuget push *.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key "${NUGET_API_KEY}"
        dotnet nuget push *.${VERSION}.snupkg --source https://api.nuget.org/v3/index.json --api-key "${NUGET_API_KEY}" --skip-duplicate
